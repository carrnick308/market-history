<!-- Paste everything below into a Squarespace Code Block on the Shiller P/E calculator page. -->
<div id="ymb-shiller-pe"></div>
<script>
(function () {
  var HOST = 'https://carrnick308.github.io';
  var PAGE = HOST + '/market-history/shiller-pe.html';
  var box = document.getElementById('ymb-shiller-pe');
  if (!box || box.firstChild) return;
  var q = new URLSearchParams(window.location.search);
  q.set('parent', window.location.origin + window.location.pathname);
  var f = document.createElement('iframe');
  f.src = PAGE + '?' + q.toString();
  f.title = 'Shiller P/E calculator';
  f.setAttribute('allow', 'clipboard-write');
  f.setAttribute('scrolling', 'no');
  f.style.cssText = 'width:100%;border:0;display:block;height:2400px;overflow:hidden';
  box.appendChild(f);
  window.addEventListener('message', function (e) {
    if (e.origin !== HOST || e.source !== f.contentWindow || !e.data || !e.data.mh) return;
    if (e.data.type === 'height') f.style.height = e.data.h + 'px';
    if (e.data.type === 'state' && window.history.replaceState) {
      window.history.replaceState(window.history.state, '', window.location.pathname + e.data.q + window.location.hash);
    }
  });
})();
</script>
